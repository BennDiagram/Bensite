    <script>
        document.querySelectorAll('.thumbnail').forEach(item => {
            item.addEventListener('click', event => {
                const videoId = item.getAttribute('data-video-id');
                const videoUrl = `https://www.youtube.com/embed/${videoId}`;
                const overlay = document.getElementById('videoOverlay');
                const videoPlayer = document.getElementById('videoPlayer');
                videoPlayer.src = videoUrl;
                overlay.style.display = 'flex';
            });
        });

        document.getElementById('closeBtn').addEventListener('click', () => {
            const overlay = document.getElementById('videoOverlay');
            const videoPlayer = document.getElementById('videoPlayer');
            videoPlayer.src = '';
            overlay.style.display = 'none';
        });
    </script>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
    // Select all timeline points
    const timelinePoints = document.querySelectorAll('.timeline-point');

    // Map points to corresponding sections based on their order
    const sections = document.querySelectorAll('section');

    timelinePoints.forEach((point, index) => {
        point.addEventListener('click', () => {
            // Get the top position of the corresponding section
            const sectionTop = sections[index].offsetTop;

            if (index === 0) {
                window.scrollTo({
                    top: sectionTop,  // No offset for the first section
                    behavior: 'smooth'
                });
            } else {
                window.scrollTo({
                    top: sectionTop + 300,  // Add offset for other sections
                    behavior: 'smooth'
                });
            }
        });
    });
});
      </script>

<script>

let currentIndex = 0;

function moveLeft() {
  const slider = document.querySelector('.slider');
  const slides = document.querySelectorAll('.slide');
  if (currentIndex > 0) {
    currentIndex--;
  } else {
    currentIndex = slides.length - 1;
  }
  slider.style.transform = `translateX(-${currentIndex * 100}%)`;
}

function moveRight() {
  const slider = document.querySelector('.slider');
  const slides = document.querySelectorAll('.slide');
  if (currentIndex < slides.length - 1) {
    currentIndex++;
  } else {
    currentIndex = 0;
  }
  slider.style.transform = `translateX(-${currentIndex * 100}%)`;
}

</script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
  const collapsibleButtons = document.querySelectorAll('.collapsible');

    collapsibleButtons.forEach(button => {
        button.addEventListener('click', function(){
            const content = this.nextElementSibling;

            this.classList.toggle('active');

            if(content.style.maxHeight) {
                content.style.maxHeight = null;
                content.classList.remove('expanded');
            } else {
                content.style.maxHeight = content.scrollHeight + 'px'; //expand to full height
                content.classList.add('expanded');
            }
        });
    });
});

</script>
  
<script>
    window.onload = function () {
        const collapsible = document.querySelectorAll('.collapsible');
        const profile = document.querySelector('.profile');

        collapsible.forEach((label, index) => {
            label.style.animationDelay = `${index * 0.1}s`;
            label.style.opacity = 1; // Set opacity to 1 to make it visible
        });
        profile.forEach((image,index) => {
            image.style.animationDelay = `${index * 0.1}s`;
            image.style.opacity = 1;
        })
    };
</script>
